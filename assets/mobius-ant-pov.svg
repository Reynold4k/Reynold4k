<svg width="1200" height="720" viewBox="0 0 1200 720" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">Ant running forever on a Mobius strip</title><desc id="desc">A cinematic chase-camera view of an ant running continuously along a glowing Mobius strip in deep space.</desc>
<defs>
<linearGradient id="space" x1="0" y1="0" x2="1200" y2="720" gradientUnits="userSpaceOnUse"><stop stop-color="#02030A"/><stop offset=".55" stop-color="#070B1E"/><stop offset="1" stop-color="#150525"/></linearGradient>
<linearGradient id="track" x1="180" y1="170" x2="1020" y2="530" gradientUnits="userSpaceOnUse"><stop stop-color="#0B5364"/><stop offset=".26" stop-color="#142A48"/><stop offset=".5" stop-color="#4A175E"/><stop offset=".76" stop-color="#112743"/><stop offset="1" stop-color="#076071"/></linearGradient>
<linearGradient id="edge" x1="90" y1="0" x2="1110" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="#00F5FF"/><stop offset=".48" stop-color="#A855F7"/><stop offset="1" stop-color="#FF38C7"/></linearGradient>
<linearGradient id="road" x1="600" y1="310" x2="600" y2="720" gradientUnits="userSpaceOnUse"><stop stop-color="#172846"/><stop offset=".55" stop-color="#0B1429"/><stop offset="1" stop-color="#030711"/></linearGradient>
<radialGradient id="halo"><stop stop-color="#8B5CF6" stop-opacity=".48"/><stop offset=".45" stop-color="#0891B2" stop-opacity=".14"/><stop offset="1" stop-color="#02030A" stop-opacity="0"/></radialGradient>
<radialGradient id="shell" cx="0" cy="0" r="1" gradientTransform="translate(566 520) rotate(58) scale(165 110)"><stop stop-color="#64748B"/><stop offset=".2" stop-color="#202B3F"/><stop offset=".7" stop-color="#080B12"/><stop offset="1"/></radialGradient>
<filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="28"/></filter>
<filter id="shadow" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-opacity=".85"/></filter>
<pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" stroke="#67E8F9" stroke-opacity=".035"/></pattern>
<clipPath id="roadClip"><path d="M496 312H704L1124 720H76L496 312Z"/></clipPath>
</defs>
<style>
.world{transform-origin:600px 350px;animation:breathe 3s ease-in-out infinite}.flow{stroke-dasharray:3 22;animation:flow .7s linear infinite}.energy{stroke-dasharray:25 1075;animation:energy 3.5s linear infinite}.dash-a{animation:rush .62s linear infinite}.dash-b{animation:rush .62s linear infinite .31s}.ant{transform-origin:600px 580px;animation:bob .32s ease-in-out infinite alternate}.legs-a{transform-origin:550px 590px;animation:strideA .32s ease-in-out infinite alternate}.legs-b{transform-origin:650px 590px;animation:strideB .32s ease-in-out infinite alternate}.feel-l{transform-origin:574px 489px;animation:feelL .92s ease-in-out infinite alternate}.feel-r{transform-origin:626px 489px;animation:feelR 1.06s ease-in-out infinite alternate}.star{animation:twinkle 2.4s ease-in-out infinite}.star:nth-of-type(3n){animation-delay:.8s}.star:nth-of-type(3n+1){animation-delay:1.6s}
@keyframes flow{to{stroke-dashoffset:-25}}@keyframes energy{to{stroke-dashoffset:-1100}}@keyframes breathe{0%,100%{transform:rotate(-.8deg) scale(1)}50%{transform:rotate(.8deg) scale(1.012)}}@keyframes rush{from{transform:translateY(-300px);opacity:0}18%{opacity:.72}to{transform:translateY(720px);opacity:0}}@keyframes bob{from{transform:translateY(0) rotate(-.35deg)}to{transform:translateY(5px) rotate(.35deg)}}@keyframes strideA{from{transform:translateX(-10px) rotate(-4deg)}to{transform:translateX(10px) rotate(5deg)}}@keyframes strideB{from{transform:translateX(10px) rotate(5deg)}to{transform:translateX(-10px) rotate(-4deg)}}@keyframes feelL{from{transform:rotate(-6deg)}to{transform:rotate(9deg)}}@keyframes feelR{from{transform:rotate(7deg)}to{transform:rotate(-8deg)}}@keyframes twinkle{0%,100%{opacity:.16}50%{opacity:1}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="1200" height="720" rx="24" fill="url(#space)"/><rect width="1200" height="720" rx="24" fill="url(#grid)"/><ellipse cx="600" cy="342" rx="430" ry="300" fill="url(#halo)" filter="url(#soft)"/>
<g fill="#E0F2FE"><circle class="star" cx="82" cy="93" r="1.4"/><circle class="star" cx="178" cy="181" r="1"/><circle class="star" cx="289" cy="73" r="1.7"/><circle class="star" cx="417" cy="142" r="1.1"/><circle class="star" cx="528" cy="52" r="1.3"/><circle class="star" cx="678" cy="91" r="1.8"/><circle class="star" cx="806" cy="54" r="1.1"/><circle class="star" cx="948" cy="147" r="1.5"/><circle class="star" cx="1112" cy="82" r="1.2"/><circle class="star" cx="1057" cy="249" r="1"/><circle class="star" cx="137" cy="287" r="1.4"/></g>
<g class="world">
<path d="M600 341C742 122 1036 151 1018 345C1002 518 771 520 600 341C429 162 198 164 182 337C164 531 458 560 600 341Z" stroke="#02040B" stroke-width="158" stroke-linecap="round" stroke-linejoin="round"/><path d="M600 341C742 122 1036 151 1018 345C1002 518 771 520 600 341C429 162 198 164 182 337C164 531 458 560 600 341Z" stroke="url(#track)" stroke-width="132" stroke-linecap="round" stroke-linejoin="round"/><path d="M600 341C742 122 1036 151 1018 345C1002 518 771 520 600 341C429 162 198 164 182 337C164 531 458 560 600 341Z" stroke="url(#edge)" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/><path class="flow" d="M600 341C742 122 1036 151 1018 345C1002 518 771 520 600 341C429 162 198 164 182 337C164 531 458 560 600 341Z" stroke="#CFFAFE" stroke-width="2.5" opacity=".58"/><path class="energy" pathLength="1100" d="M600 341C742 122 1036 151 1018 345C1002 518 771 520 600 341C429 162 198 164 182 337C164 531 458 560 600 341Z" stroke="#FFF" stroke-width="8" stroke-linecap="round" filter="url(#glow)"/>
<path d="M496 312H704L1124 720H76L496 312Z" fill="url(#road)"/><path d="M496 312L76 720M704 312L1124 720" stroke="url(#edge)" stroke-width="5" filter="url(#glow)"/><g clip-path="url(#roadClip)" opacity=".72"><path class="dash-a" d="M600 150V980M516 150L272 980M684 150L928 980" stroke="#67E8F9" stroke-width="3" stroke-dasharray="12 34"/><path class="dash-b" d="M558 150L430 980M642 150L770 980" stroke="#D8B4FE" stroke-width="2" stroke-dasharray="7 44"/><path d="M74 600H1126M151 523H1049M228 446H972M305 369H895" stroke="#A78BFA" stroke-opacity=".16" stroke-width="2"/></g><ellipse cx="600" cy="325" rx="96" ry="18" fill="#67E8F9" opacity=".16" filter="url(#glow)"/>
</g>
<g stroke-linecap="round" filter="url(#glow)"><path class="dash-a" d="M64 190L18 446" stroke="#22D3EE" stroke-width="3" opacity=".42"/><path class="dash-b" d="M1138 162L1190 438" stroke="#F472B6" stroke-width="3" opacity=".42"/><path class="dash-b" d="M134 82L72 311" stroke="#A78BFA" stroke-width="2" opacity=".3"/><path class="dash-a" d="M1074 74L1137 314" stroke="#67E8F9" stroke-width="2" opacity=".3"/></g>
<g class="ant" filter="url(#shadow)"><g class="legs-a" stroke="#05070C" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"><path d="M551 563L463 581L399 641"/><path d="M539 610L427 641L351 708"/><path d="M548 656L452 699L412 720"/></g><g class="legs-b" stroke="#05070C" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"><path d="M649 563L737 581L801 641"/><path d="M661 610L773 641L849 708"/><path d="M652 656L748 699L788 720"/></g><ellipse cx="600" cy="674" rx="119" ry="82" fill="url(#shell)" stroke="#334155" stroke-width="3"/><ellipse cx="600" cy="579" rx="79" ry="70" fill="url(#shell)" stroke="#334155" stroke-width="3"/><ellipse cx="600" cy="506" rx="58" ry="48" fill="url(#shell)" stroke="#475569" stroke-width="3"/><path class="feel-l" d="M574 489C535 437 485 421 446 436C416 447 400 472 388 500" stroke="#080B12" stroke-width="11" stroke-linecap="round"/><path class="feel-r" d="M626 489C665 437 715 421 754 436C784 447 800 472 812 500" stroke="#080B12" stroke-width="11" stroke-linecap="round"/><circle cx="388" cy="500" r="8" fill="#111827"/><circle cx="812" cy="500" r="8" fill="#111827"/><ellipse cx="579" cy="493" rx="9" ry="6" fill="#67E8F9" opacity=".72" filter="url(#glow)"/><ellipse cx="621" cy="493" rx="9" ry="6" fill="#FF38C7" opacity=".72" filter="url(#glow)"/></g>
<rect x="1" y="1" width="1198" height="718" rx="23" stroke="url(#edge)" stroke-opacity=".36" stroke-width="2"/>
</svg>
