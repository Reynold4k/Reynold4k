<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Nanopore MinimumBIO repository terminal</title>
  <desc id="desc">Animated futuristic repository card for Nanopore MinimumBIO with a planet, orbiting particles and scan lines.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#02030B"/>
      <stop offset="0.48" stop-color="#07112B"/>
      <stop offset="1" stop-color="#12072B"/>
    </linearGradient>
    <linearGradient id="rail" x1="80" y1="0" x2="1120" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#06B6D4" stop-opacity="0"/>
      <stop offset="0.28" stop-color="#45F7FF"/>
      <stop offset="0.72" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#FF3DCE" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="planet" cx="0" cy="0" r="1" gradientTransform="translate(1014 151) rotate(131) scale(102)">
      <stop stop-color="#5EE7F7"/>
      <stop offset="0.22" stop-color="#2257A7"/>
      <stop offset="0.58" stop-color="#191354"/>
      <stop offset="1" stop-color="#03040D"/>
    </radialGradient>
    <radialGradient id="halo">
      <stop stop-color="#06B6D4" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" stroke="#67E8F9" stroke-opacity="0.055"/>
    </pattern>
    <filter id="glow" x="-200%" y="-200%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <clipPath id="panelClip"><rect width="1200" height="300" rx="20"/></clipPath>
  </defs>

  <style>
    .orbit { transform-box: fill-box; transform-origin: center; animation: spin 9s linear infinite; }
    .orbit-slow { transform-box: fill-box; transform-origin: center; animation: spin 17s linear infinite reverse; }
    .pulse { animation: pulse 2.8s ease-in-out infinite; }
    .blink { animation: blink 1s steps(2, jump-none) infinite; }
    .scan { animation: scan 5.5s linear infinite; }
    .role-a { animation: roleA 12s ease-in-out infinite; }
    .role-b { animation: roleB 12s ease-in-out infinite; }
    .role-c { animation: roleC 12s ease-in-out infinite; }
    .signal { stroke-dasharray: 9 14; animation: flow 2.2s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse { 0%,100% { opacity:.35; } 50% { opacity:1; } }
    @keyframes blink { 50% { opacity:0; } }
    @keyframes scan { from { transform: translateY(-320px); } to { transform: translateY(320px); } }
    @keyframes flow { to { stroke-dashoffset:-46; } }
    @keyframes roleA { 0%,27% { opacity:1; transform:translateY(0); } 31%,96% { opacity:0; transform:translateY(-7px); } 100% { opacity:1; } }
    @keyframes roleB { 0%,29% { opacity:0; transform:translateY(7px); } 34%,61% { opacity:1; transform:translateY(0); } 66%,100% { opacity:0; transform:translateY(-7px); } }
    @keyframes roleC { 0%,63% { opacity:0; transform:translateY(7px); } 68%,94% { opacity:1; transform:translateY(0); } 100% { opacity:0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .role-b,.role-c { display:none; } }
  </style>

  <g clip-path="url(#panelClip)">
    <rect width="1200" height="300" rx="20" fill="url(#panel)"/>
    <rect width="1200" height="300" fill="url(#grid)"/>
    <ellipse cx="996" cy="151" rx="180" ry="172" fill="url(#halo)" opacity="0.25" filter="url(#soft)"/>

    <g opacity="0.72">
      <circle cx="60" cy="54" r="1.4" fill="#67E8F9" class="pulse"/>
      <circle cx="158" cy="234" r="1" fill="#C4B5FD"/>
      <circle cx="293" cy="42" r="1.2" fill="#FF3DCE" class="pulse" style="animation-delay:.7s"/>
      <circle cx="420" cy="262" r="1.1" fill="#67E8F9"/>
      <circle cx="599" cy="32" r="1.4" fill="#C4B5FD" class="pulse" style="animation-delay:1.4s"/>
      <circle cx="733" cy="239" r="1" fill="#67E8F9"/>
      <circle cx="843" cy="62" r="1.3" fill="#FF3DCE" class="pulse" style="animation-delay:2.1s"/>
      <circle cx="1143" cy="42" r="1" fill="#C4B5FD"/>
    </g>

    <path d="M38 34H146L160 20H358" stroke="url(#rail)"/>
    <path d="M38 266H264L278 280H514" stroke="url(#rail)" opacity="0.7"/>
    <path d="M460 54H803" stroke="#22D3EE" stroke-opacity="0.36" class="signal"/>
    <rect x="0" y="-18" width="1200" height="36" fill="#67E8F9" opacity="0.055" class="scan"/>

    <g transform="translate(1008 151)">
      <ellipse rx="143" ry="49" stroke="#67E8F9" stroke-opacity="0.34" stroke-width="1.2" transform="rotate(-13)" class="orbit-slow"/>
      <ellipse rx="121" ry="77" stroke="#A78BFA" stroke-opacity="0.30" stroke-width="1.2" transform="rotate(29)" class="orbit"/>
      <g class="orbit">
        <circle cx="-108" cy="0" r="5" fill="#FF3DCE" filter="url(#glow)"/>
        <circle cx="108" cy="0" r="2.5" fill="#67E8F9" filter="url(#glow)"/>
      </g>
      <circle r="67" fill="url(#planet)" stroke="#67E8F9" stroke-opacity="0.45"/>
      <path d="M-86 12C-41 42 49 42 91 0" stroke="#67E8F9" stroke-width="9" stroke-opacity="0.68"/>
      <path d="M-91 5C-46 35 47 38 91 -7" stroke="#D8B4FE" stroke-width="2"/>
      <path d="M-85 21C-30 48 46 41 87 6" stroke="#FF3DCE" stroke-width="1.2" stroke-opacity="0.75"/>
      <circle cx="-23" cy="-28" r="8" fill="#67E8F9" opacity="0.18"/>
    </g>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <text x="68" y="84" fill="#67E8F9" font-size="14" letter-spacing="4">REPOSITORY SIGNAL // 001</text>
      <text x="68" y="148" fill="#F8FAFC" font-size="44" font-weight="700" letter-spacing="3">NANOPORE_MINIMUMBIO</text>
      <rect x="69" y="167" width="430" height="2" fill="url(#rail)"/>
      <g font-size="17" letter-spacing="2">
        <text x="69" y="205" fill="#C4B5FD" class="role-a">NANOPORE RESEARCH // R</text>
        <text x="69" y="205" fill="#67E8F9" class="role-b">SEQUENCING ANALYTICS</text>
        <text x="69" y="205" fill="#F0ABFC" class="role-c">PUBLIC REPOSITORY</text>
      </g>
      <text x="69" y="241" fill="#64748B" font-size="12" letter-spacing="2">R LANGUAGE // PUBLIC // ONLINE</text>
      <text x="415" y="241" fill="#67E8F9" font-size="13" class="blink">▮</text>
    </g>

    <g transform="translate(748 253)" font-family="ui-monospace, monospace" font-size="10" fill="#94A3B8">
      <text>REPO 858480769</text>
      <circle cx="122" cy="-4" r="3" fill="#22C55E" filter="url(#glow)" class="pulse"/>
    </g>
  </g>
  <rect x="0.75" y="0.75" width="1198.5" height="298.5" rx="19.25" stroke="url(#rail)" stroke-width="1.5"/>
</svg>

